<!DOCTYPE html>
<html lang="sl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="screen-orientation" content="portrait">
  <title>Zlati Gol</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@400;500;600&display=swap"
    rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    :root {
      --green: #007A3D;
      --gd: #005a2b;
      --gg: rgba(0, 122, 61, 0.35);
      --gold: #c8f0d8;
      --gdc: #60C090;
      --bg: #040b06;
    }

    html,
    body {
      height: 100dvh;
    }

    body {
      background: #04160e;
      display: flex;
      justify-content: center;
      overflow: hidden;
      font-family: 'Barlow', sans-serif;
    }

    .game {
      width: 100%;
      max-width: 480px;
      height: 100dvh;
      background:
        linear-gradient(
          160deg,
          rgba(4, 22, 14, 1) 0%,
          rgba(5, 28, 18, 1) 50%,
          rgba(4, 22, 14, 1) 100%
        );
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
      transition: box-shadow .3s;
    }

    .game.flash {
      box-shadow: inset 0 0 80px rgba(0, 255, 100, .5) !important;
    }

    .header {
      flex-shrink: 0;
      background: rgba(10, 38, 26, 0.72);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(46, 178, 121, 0.22);
      padding: calc(8px + env(safe-area-inset-top, 0px)) 14px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
    }

    .header::after {
      display: none;
    }

    .header-logo {
      width: clamp(36px, 10vw, 44px);
      height: clamp(36px, 10vw, 44px);
      object-fit: contain;
      filter: drop-shadow(0 0 7px rgba(46,178,121,0.5));
    }

    .wordmark {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 900;
      font-size: clamp(20px, 5.5vw, 26px);
      color: #fff;
      letter-spacing: 0.03em;
      line-height: 1;
      text-transform: uppercase;
    }

    .tagline {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: clamp(10px, 2.8vw, 13px);
      font-weight: 600;
      color: #2EB279;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-top: 3px;
    }

    .shots {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .shots-lbl {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: clamp(10px, 2.8vw, 13px);
      font-weight: 600;
      color: #2EB279;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .shots-num {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 900;
      font-size: clamp(24px, 7vw, 32px);
      color: #fff;
      line-height: 1;
    }

    .sponsor {
      flex-shrink: 0;
      background: linear-gradient(90deg, #ED1C24, #d41920);
      border-bottom: 2px solid #b01018;
      padding: 5px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .sp-lbl {
      font-size: clamp(7px, 2vw, 9px);
      color: rgba(255, 255, 255, .7);
      letter-spacing: 2px;
      text-transform: uppercase;
      flex-shrink: 0;
    }

    .sp-logo {
      flex: 1;
      text-align: center;
    }

    .sp-url {
      font-size: clamp(7px, 2vw, 9px);
      color: rgba(255, 255, 255, .7);
      letter-spacing: 1px;
      text-align: right;
      flex-shrink: 0;
      max-width: 90px;
      line-height: 1.3;
    }

    .cwrap {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    canvas {
      transform: translateZ(0);
      touch-action:none;


      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: crosshair;
    }

    .bottomui {
      flex-shrink: 0;
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
      display: flex;
      align-items: center;
      background: rgba(10, 38, 26, 0.72);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid rgba(46, 178, 121, 0.22);
      position: relative;
    }

    .bottomui::before {
      display: none;
    }

    .sbox {
      position: relative;
      z-index: 1;
      text-align: center;
    }

    .sbox .sl {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: clamp(10px, 2.8vw, 13px);
      font-weight: 600;
      color: #2EB279;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .sbox .sv {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 900;
      font-size: clamp(24px, 7vw, 32px);
      color: #fff;
      line-height: 1;
    }

    .hint {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: clamp(15px, 4.2vw, 19px);
      color: #2EB279;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      text-align: center;
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      transition: opacity .4s;
    }

    .ov {
      position: absolute;
      inset: 0;
      background: rgba(2, 10, 3, .98);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 200;
      animation: fadeIn .22s ease;
      padding: 24px 28px;
      gap: 10px;
      overflow-y: auto;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: scale(.94)
      }

      to {
        opacity: 1;
        transform: scale(1)
      }
    }

    .oi {
      font-size: clamp(44px, 14vw, 64px);
      animation: popIn .4s cubic-bezier(.34, 1.56, .64, 1);
    }

    @keyframes popIn {
      0% {
        transform: scale(.1) rotate(-20deg);
        opacity: 0
      }

      100% {
        transform: scale(1);
        opacity: 1
      }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-8px); }
      40% { transform: translateX(7px); }
      60% { transform: translateX(-5px); }
      80% { transform: translateX(3px); }
    }

    .ot {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 900;
      font-size: clamp(28px, 9vw, 40px);
      letter-spacing: 4px;
    }

    .os {
      font-family: 'Barlow', sans-serif;
      font-weight: 500;
      font-size: clamp(13px, 3.5vw, 15px);
      color: #9bbfb0;
      text-align: center;
      line-height: 1.5;
    }

    .opts {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 900;
      font-size: clamp(36px, 12vw, 52px);
      color: var(--gold);
      text-shadow: 0 0 20px rgba(46,178,121, .4);
    }

    .obtn {
      padding: 14px 0;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 800;
      font-size: clamp(14px, 4vw, 18px);
      letter-spacing: 2px;
      color: #fff;
      background: linear-gradient(135deg, var(--gd), var(--green));
      box-shadow: 0 4px 16px var(--gg);
      transition: transform .1s;
      width: 100%;
      margin-top: 2px;
    }

    .obtn:active {
      transform: scale(.97);
    }

    .obtn.gold {
      background: linear-gradient(135deg, var(--gdc), var(--gold));
      color: #04160e;
      box-shadow: 0 4px 14px rgba(46,178,121, .35);
    }

    .obtn.white {
      background: #fff;
      color: #000;
      box-shadow: 0 4px 14px rgba(255, 255, 255, 0.15);
    }

    .obtn.ghost {
      background: transparent;
      border: 1px solid #1a3a22;
      font-size: clamp(11px, 3vw, 14px);
      color: #3a6a45;
    }

    .summary {
      background: rgba(0, 122, 61, .08);
      border: 1px solid #1a3a22;
      border-radius: 12px;
      padding: 10px 18px;
      text-align: center;
      width: 100%;
    }

    .summary .sl {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: clamp(10px, 2.8vw, 13px);
      font-weight: 600;
      color: #2EB279;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .summary .sv {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 900;
      font-size: clamp(26px, 8vw, 34px);
      color: #fff;
      line-height: 1;
    }

    .bdown {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .brow {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 12px;
      background: rgba(0, 122, 61, .06);
      border-radius: 8px;
      border-left: 3px solid transparent;
    }

    .brow.g100 {
      border-left-color: var(--gold);
    }

    .brow.g50 {
      border-left-color: #60C090;
    }

    .brow.g25 {
      border-left-color: var(--green);
    }

    .brow.miss {
      border-left-color: #ff4444;
    }

    .brow-l {
      font-family: 'Barlow', sans-serif;
      font-weight: 600;
      font-size: clamp(11px, 3vw, 13px);
      color: #9bbfb0;
    }

    .brow-v {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 900;
      font-size: clamp(16px, 4.5vw, 20px);
    }

    .fwrap {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .fgroup {
      display: flex;
      flex-direction: column;
    }

    .fwrap > .fgroup + .fgroup,
    .fwrap > div + .fgroup {
      margin-top: 10px;
    }

    .field-err {
      display: none;
      color: #ff4444;
      font-size: clamp(11px, 3vw, 12px);
      font-family: 'Barlow', sans-serif;
      margin-top: 4px;
      min-height: 16px;
    }

    .fl {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: clamp(12px, 3.2vw, 14px);
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 6px;
      margin-top: 0;
    }

    .fi {
      width: 100%;
      padding: 11px 14px;
      background: rgba(0, 122, 61, .07);
      border: 1.5px solid #1a3a22;
      border-radius: 12px;
      color: #fff;
      font-size: clamp(14px, 4vw, 16px);
      font-family: 'Barlow', sans-serif;
      font-weight: 500;
      outline: none;
      transition: border .2s;
    }

    .fi::placeholder {
      color: #2a5a35;
      font-weight: 500;
    }

    .fi:focus {
      border-color: var(--green);
    }

    @media (orientation: landscape) and (max-height: 430px) {
      .landscape-block { display: flex !important; }
    }
    .landscape-block {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #04160e;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      font-family: 'Barlow Condensed', sans-serif;
      color: #fff;
      text-align: center;
      padding: 24px;
    }
    .landscape-block p { font-size: 22px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: #2EB279; }
    .landscape-block small { font-size: 14px; color: #9bbfb0; font-family: 'Barlow', sans-serif; font-weight: 400; text-transform: none; letter-spacing: 0; }

    .consent-check {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      cursor: pointer;
      width: 100%;
      text-align: left;
      margin-top: 8px;
    }
    .consent-check input[type=checkbox] {
      flex-shrink: 0;
      width: 15px;
      height: 15px;
      margin-top: 2px;
      accent-color: var(--green);
      cursor: pointer;
    }
    .consent-check span {
      font-size: clamp(10px, 2.6vw, 11px);
      color: #6a9a88;
      line-height: 1.4;
      font-family: 'Barlow', sans-serif;
    }
    .consent-check span a {
      color: #2EB279;
      text-decoration: underline;
    }
    .consent-check.err span { color: #ff8888; }
  </style>
</head>

<body>
  <div class="landscape-block">
    <p>Zavrti telefon</p>
    <small>Igra deluje samo v pokončnem načinu</small>
  </div>
  <div class="game" id="game">
    <div class="header">
      <div style="display:flex;align-items:center;gap:14px">
        <img class="header-logo" src="dragon_green.png" alt="HK Olimpija">
        <div>
          <div class="wordmark">Zlati Gol</div>
          <div class="tagline">Igra dneva</div>
        </div>
      </div>
      <div class="shots">
        <div class="shots-lbl">STRELI</div>
        <div class="shots-num" id="shotNum">3</div>
      </div>
    </div>
    <div class="cwrap"><canvas id="c"></canvas></div>
    <div class="bottomui">
      <div class="sbox">
        <div class="sl">SKUPAJ</div>
        <div class="sv" id="totalPts">0</div>
      </div>
      <div class="hint" id="hint">Povleci pak in zadeni gol!</div>
    </div>
  </div>
  <script>
    // ── Assets ────────────────────────────────────────────────────────────────────
    const imgDragon = new Image(); imgDragon.src = 'dragon_green.png';
    const imgBolzano = new Image(); imgBolzano.src = 'hc-pustertal-logo.png';
    const imgTriglav = new Image(); imgTriglav.src = 'lon-logo.png';

    // Redraw static layer when images load (they may load after first resize)
    imgDragon.onload = imgTriglav.onload = () => { if (W) buildStaticLayer(); };
    imgBolzano.onload = () => { if (W) buildDefSprite(); };

    // ── Canvas ────────────────────────────────────────────────────────────────────
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d', { alpha:false });
    let W, H, S, DPR;
    const r = v => Math.round(v * S);

    // Offscreen canvases — drawn once, composited every frame
    let staticLayer = null;   // ice + lines + banners + center logo
    let defSprite = null;   // single defender template (no position)
    let puckSprite = null;   // puck body (no position)
    let goalStatic = null;   // goal posts + crease (no animation)

    // ── Physics ───────────────────────────────────────────────────────────────────
    const FR = 0.983;
    const BN = 0.70;
    const BASE_LM = 0.175;
    const PUCK_R = () => r(14);
    const DEF_R = () => r(24);
    const MAX_PUL = () => r(90);
    const getLM = () => BASE_LM / Math.sqrt(S);

    // ── Zone config ───────────────────────────────────────────────────────────────
    const ZONE_DEFS = [
      { frac: 0.22, pts: 25, color: '#007A3D' },
      { frac: 0.20, pts: 50, color: '#60C090' },
      { frac: 0.16, pts: 100, color: '#c8f0d8' },
      { frac: 0.20, pts: 50, color: '#60C090' },
      { frac: 0.22, pts: 25, color: '#007A3D' },
    ];

    // ── Game state ────────────────────────────────────────────────────────────────
    const G = { attemptsLeft: 3, totalScore: 0, shots: [], phase: 'idle' };
    let puck, defenders, goalZones, goalH, rink;
    let trail = [], sparks = [], floaters = [], goalBurst = [];
    let isDragging = false, dragStartX, dragStartY;
    let mzIdx = 2, mzDir = 1, mzT = 0;
    let tutDone = false, tutA = 0;
    let slowMo = 1;          // dt multiplier (1 = normal, <1 = slow-mo)
    let shakeX = 0, shakeY = 0, shakePow = 0; // screen shake

    const hint = show => document.getElementById('hint').style.opacity = show ? '1' : '0';

    // ── Offscreen canvas helper ───────────────────────────────────────────────────
    function makeOffscreen(w, h) {
      const oc = document.createElement('canvas');
      oc.width = w * DPR;
      oc.height = h * DPR;
      const oc2 = oc.getContext('2d');
      oc2.setTransform(DPR, 0, 0, DPR, 0, 0);
      return { canvas: oc, ctx: oc2 };
    }

    // ── Path helpers ──────────────────────────────────────────────────────────────
    function roundRectPath(c, x, y, w, h, cr) {
      c.beginPath();
      c.moveTo(x + cr, y); c.lineTo(x + w - cr, y); c.arcTo(x + w, y, x + w, y + cr, cr);
      c.lineTo(x + w, y + h - cr); c.arcTo(x + w, y + h, x + w - cr, y + h, cr);
      c.lineTo(x + cr, y + h); c.arcTo(x, y + h, x, y + h - cr, cr);
      c.lineTo(x, y + cr); c.arcTo(x, y, x + cr, y, cr);
      c.closePath();
    }
    function circPath(c, x, y, rad) { c.beginPath(); c.arc(x, y, rad, 0, Math.PI * 2); }

    // ── Build static layer (ice + markings + banners) ─────────────────────────────
    function buildStaticLayer() {
      const { canvas: oc, ctx: c } = makeOffscreen(W, H);
      staticLayer = oc;

      // Background
      c.fillStyle = '#0a261a'; c.fillRect(0, 0, W, H);

      // Ice surface
      const g = c.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, '#b0d8ea'); g.addColorStop(0.35, '#d4eeff');
      g.addColorStop(0.65, '#d8f0ff'); g.addColorStop(1, '#b0d8ea');
      c.fillStyle = g;
      roundRectPath(c, rink.x, rink.y, rink.w, rink.h, rink.cr); c.fill();

      // Rink border
      c.strokeStyle = 'rgba(50,80,110,0.4)'; c.lineWidth = Math.max(2, 2.5 * S);
      roundRectPath(c, rink.x, rink.y, rink.w, rink.h, rink.cr); c.stroke();

      // Clip interior
      c.save();
      roundRectPath(c, rink.x, rink.y, rink.w, rink.h, rink.cr); c.clip();

      // Scratch lines
      c.strokeStyle = 'rgba(150,195,225,0.12)'; c.lineWidth = 0.5;
      for (let x = 0; x < W; x += r(18)) { c.beginPath(); c.moveTo(x, 0); c.lineTo(x, H); c.stroke(); }

      // Blue lines
      c.strokeStyle = 'rgba(17,51,204,0.45)'; c.lineWidth = Math.max(3, 3.5 * S);
      for (const y of [H * 0.28, H * 0.72]) { c.beginPath(); c.moveTo(rink.x + 4, y); c.lineTo(rink.x + rink.w - 4, y); c.stroke(); }

      // Red center line
      c.strokeStyle = 'rgba(204,17,17,0.45)'; c.lineWidth = Math.max(3, 3.5 * S);
      c.beginPath(); c.moveTo(rink.x + 4, H * 0.5); c.lineTo(rink.x + rink.w - 4, H * 0.5); c.stroke();

      // Center circle
      const cR = r(50), cy = H * 0.5;
      c.strokeStyle = 'rgba(204,17,17,0.4)'; c.lineWidth = Math.max(2, 2.5 * S);
      circPath(c, W / 2, cy, cR); c.stroke();

      // Dragon logo clipped
      c.save();
      circPath(c, W / 2, cy, cR - r(3)); c.clip();
      c.fillStyle = 'rgba(0,122,61,0.08)'; c.fill();
      if (imgDragon.complete && imgDragon.naturalWidth > 0) {
        const lH = cR * 1.4, lW = lH * imgDragon.naturalWidth / imgDragon.naturalHeight;
        c.globalAlpha = 0.35;
        c.drawImage(imgDragon, W / 2 - lW / 2, cy - lH / 2, lW, lH);
        c.globalAlpha = 1;
      }
      c.restore();

      // Center dot
      c.fillStyle = 'rgba(204,17,17,0.6)';
      circPath(c, W / 2, cy, Math.max(2, 2.5 * S)); c.fill();

      // Ice sheen
      const sh = c.createRadialGradient(W * 0.3, H * 0.15, 0, W * 0.35, H * 0.2, W * 0.4);
      sh.addColorStop(0, 'rgba(255,255,255,0.15)'); sh.addColorStop(1, 'rgba(255,255,255,0)');
      c.fillStyle = sh; c.fillRect(0, 0, W, H);

      // Kazenski polkrog (na ledu, pred golom)
      const g0c = goalZones[0].x, gEc = goalZones[goalZones.length - 1].x + goalZones[goalZones.length - 1].w;
      c.strokeStyle = 'rgba(17,51,204,0.5)'; c.lineWidth = Math.max(2, 2.5 * S);
      c.fillStyle = 'rgba(17,51,204,0.06)';
      c.beginPath(); c.arc(W / 2, goalH + 2, (gEc - g0c) * 0.55, 0, Math.PI); c.closePath();
      c.fill(); c.stroke();

      drawBoardAdsTo(c);
      c.restore();
    }

    // ── Draw board ads to a given context ────────────────────────────────────────
    function drawBoardAdsTo(c) {
      const shadowH = r(4);
      const ADS = [
        { bg: '#1a4a43', border: 'rgba(255,255,255,0.25)', isLogo: true },
        { bg: '#2a7a6e', border: 'rgba(255,255,255,0.25)', isLogo: false },
      ];

      function drawAdContent(ad, boardH, isVertical) {
        if (ad.isLogo) {
          const iH = boardH * (isVertical ? 0.22 : 0.6), iW = iH * imgTriglav.naturalWidth / imgTriglav.naturalHeight;
          c.drawImage(imgTriglav, -iW / 2, -iH / 2, iW, iH);
        } else {
          c.fillStyle = '#fff';
          c.font = `700 ${Math.max(10, r(13))}px 'Barlow',sans-serif`;
          c.textAlign = 'center'; c.textBaseline = 'middle';
          c.fillText('lon.si', 0, 0);
        }
      }

      // Horizontal boards
      const hH = r(28), hHalf = r(50), hShrink = hHalf * 0.15;
      for (const { cx, adIdx } of [{ cx: W * 0.25, adIdx: 0 }, { cx: W * 0.75, adIdx: 1 }]) {
        const ad = ADS[adIdx], cy = H * 0.88;
        c.fillStyle = 'rgba(0,0,0,0.12)';
        c.beginPath(); c.ellipse(cx, cy + 2, hHalf * 0.9, shadowH, 0, 0, Math.PI * 2); c.fill();
        c.beginPath();
        c.moveTo(cx - hHalf, cy); c.lineTo(cx - hHalf + hShrink, cy - hH);
        c.lineTo(cx + hHalf - hShrink, cy - hH); c.lineTo(cx + hHalf, cy);
        c.closePath(); c.fillStyle = ad.bg; c.fill();
        c.strokeStyle = ad.border; c.lineWidth = Math.max(1, 1.5 * S); c.stroke();
        c.strokeStyle = 'rgba(255,255,255,0.25)'; c.lineWidth = Math.max(1, S);
        c.beginPath(); c.moveTo(cx - hHalf + hShrink, cy - hH); c.lineTo(cx + hHalf - hShrink, cy - hH); c.stroke();
        c.save(); c.translate(cx, cy - hH / 2); drawAdContent(ad, hH, false); c.restore();
      }

      // Vertical boards
      const vH = r(90), vHalf = r(14), vSkew = r(4);
      for (const { cx, cy, adIdx, left } of [
        { cx: W * 0.06, cy: H * 0.35, adIdx: 0, left: true },
        { cx: W * 0.06, cy: H * 0.60, adIdx: 1, left: true },
        { cx: W * 0.94, cy: H * 0.35, adIdx: 1, left: false },
        { cx: W * 0.94, cy: H * 0.60, adIdx: 0, left: false },
      ]) {
        const ad = ADS[adIdx];
        const outerX = left ? cx - vHalf : cx + vHalf, innerX = left ? cx + vHalf : cx - vHalf;
        const oTop = cy - vH / 2 - vSkew, oBot = cy + vH / 2 - vSkew, iTop = cy - vH / 2, iBot = cy + vH / 2;
        c.fillStyle = 'rgba(0,0,0,0.1)';
        c.beginPath(); c.ellipse(cx, iBot, vHalf * 0.7, shadowH, 0, 0, Math.PI * 2); c.fill();
        c.beginPath();
        if (left) { c.moveTo(outerX, oBot); c.lineTo(outerX, oTop); c.lineTo(innerX, iTop); c.lineTo(innerX, iBot); }
        else { c.moveTo(innerX, iBot); c.lineTo(innerX, iTop); c.lineTo(outerX, oTop); c.lineTo(outerX, oBot); }
        c.closePath(); c.fillStyle = ad.bg; c.fill();
        c.strokeStyle = ad.border; c.lineWidth = Math.max(1, 1.5 * S); c.stroke();
        c.strokeStyle = 'rgba(255,255,255,0.2)'; c.lineWidth = Math.max(1, S);
        c.beginPath(); c.moveTo(outerX, oTop); c.lineTo(innerX, iTop); c.stroke();
        c.save();
        c.transform(1, left ? vSkew / (vHalf * 2) : -vSkew / (vHalf * 2), 0, 1, cx, cy - vSkew / 2);
        c.rotate(left ? -Math.PI / 2 : Math.PI / 2);
        drawAdContent(ad, vH, true);
        c.restore();
      }
    }

    // ── Build goal static layer (posts + crease, no pulse animation) ──────────────
    function buildGoalStatic() {
      const g0 = goalZones[0].x, gE = goalZones[goalZones.length - 1].x + goalZones[goalZones.length - 1].w;
      const margin = r(30);
      const ow = gE - g0 + margin * 2, oh = goalH + r(40);
      const { canvas: oc, ctx: c } = makeOffscreen(ow, oh);
      goalStatic = { canvas: oc, dx: g0 - margin, dy: 0, gw: gE - g0 };

      const lx = margin, rx = margin + gE - g0;
      const pw = Math.max(4, r(5));

      // Post glow
      for (const px of [lx, rx]) {
        const pg = c.createRadialGradient(px, goalH / 2, 0, px, goalH / 2, r(14));
        pg.addColorStop(0, 'rgba(255,80,30,0.35)'); pg.addColorStop(1, 'rgba(255,80,30,0)');
        c.fillStyle = pg; c.beginPath(); c.arc(px, goalH / 2, r(14), 0, Math.PI * 2); c.fill();
      }

      // Goal frame
      c.strokeStyle = '#ff5533'; c.lineWidth = Math.max(2, 3 * S);
      c.strokeRect(lx, 0, gE - g0, goalH);
      c.fillStyle = '#ff3311';
      c.fillRect(lx - pw / 2, 0, pw, goalH + r(4));
      c.fillRect(rx - pw / 2, 0, pw, goalH + r(4));

    }

    // ── Build defender sprite ─────────────────────────────────────────────────────
    function buildDefSprite() {
      const dr = DEF_R(), pad = Math.max(4, r(4));
      const sz = (dr + pad) * 2;
      const { canvas: oc, ctx: c } = makeOffscreen(sz, sz);
      defSprite = { canvas: oc, half: sz / 2 };
      const cx = sz / 2, cy = sz / 2;

      // Shadow (offset slightly)
      c.fillStyle = 'rgba(0,0,0,0.2)';
      c.beginPath(); c.ellipse(cx + 2 * S, cy + dr * 0.4, dr * 0.9, dr * 0.3, 0, 0, Math.PI * 2); c.fill();

      // Body
      const bg = c.createRadialGradient(cx - 2 * S, cy - 3 * S, 1, cx, cy, dr);
      bg.addColorStop(0, '#2a2a2a'); bg.addColorStop(1, '#111');
      c.fillStyle = bg; c.beginPath(); c.arc(cx, cy, dr, 0, Math.PI * 2); c.fill();

      // Falkensteiner yellow ring
      c.strokeStyle = '#feca07'; c.lineWidth = Math.max(2.5, 3 * S);
      c.beginPath(); c.arc(cx, cy, dr, 0, Math.PI * 2); c.stroke();

      // White outer ring
      c.strokeStyle = 'rgba(255,255,255,0.25)'; c.lineWidth = Math.max(1, 1.2 * S);
      c.beginPath(); c.arc(cx, cy, dr + Math.max(1.5, 2 * S), 0, Math.PI * 2); c.stroke();

      // Logo (if loaded)
      if (imgBolzano.complete && imgBolzano.naturalWidth > 0) {
        const li = dr * 1.4;
        c.drawImage(imgBolzano, cx - li / 2, cy - li / 2, li, li);
      }
    }

    // ── Build puck sprite ─────────────────────────────────────────────────────────
    function buildPuckSprite() {
      const pr = PUCK_R(), pad = r(8);
      const sz = (pr + pad) * 2;
      const { canvas: oc, ctx: c } = makeOffscreen(sz, sz);
      puckSprite = { canvas: oc, half: sz / 2 };
      const cx = sz / 2, cy = sz / 2;

      // Glow
      const glow = c.createRadialGradient(cx, cy, 0, cx, cy, pr + 6 * S);
      glow.addColorStop(0, 'rgba(0,140,70,0.25)'); glow.addColorStop(1, 'rgba(0,140,70,0)');
      c.fillStyle = glow; c.beginPath(); c.arc(cx, cy, pr + 6 * S, 0, Math.PI * 2); c.fill();

      // Body
      const body = c.createRadialGradient(cx - 2 * S, cy - 2 * S, 1, cx, cy, pr);
      body.addColorStop(0, '#777'); body.addColorStop(1, '#111');
      c.fillStyle = body; c.beginPath(); c.arc(cx, cy, pr, 0, Math.PI * 2); c.fill();
      c.strokeStyle = '#444'; c.lineWidth = Math.max(1, 1.5 * S);
      c.beginPath(); c.arc(cx, cy, pr, 0, Math.PI * 2); c.stroke();

      // Highlight
      c.fillStyle = 'rgba(255,255,255,0.18)';
      c.beginPath(); c.arc(cx - 2 * S, cy - 2 * S, 3 * S, 0, Math.PI * 2); c.fill();
    }

    // ── Init world ────────────────────────────────────────────────────────────────
    function initWorld() {
      rink = { x: r(4), y: r(4), w: W - r(8), h: H - r(8), cr: r(28) };
      goalH = Math.max(Math.round(H * 0.055), 22);

      const gw = W * 0.48, gx = (W - gw) / 2;
      let cx = gx;
      goalZones = ZONE_DEFS.map(z => {
        const zone = { x: cx, y: 0, w: gw * z.frac, h: goalH, pts: z.pts, color: z.color, label: String(z.pts) };
        cx += zone.w; return zone;
      });

      puck = { x: W / 2, y: H * 0.78, vx: 0, vy: 0, r: PUCK_R() };
      const dr = DEF_R();

      const defenderSpeed = 1.75;
      defenders = [
        { x: W * 0.22, y: H * 0.24, vx: 160 * defenderSpeed * S, r: dr, minX: W * 0.08, maxX: W * 0.55 },
        { x: W * 0.78, y: H * 0.38, vx: -140 * defenderSpeed * S, r: dr, minX: W * 0.45, maxX: W * 0.92 },
        { x: W * 0.50, y: H * 0.52, vx: 100 * defenderSpeed * S, r: dr, minX: W * 0.28, maxX: W * 0.72 },
        { x: W * 0.65, y: H * 0.64, vx: -120 * defenderSpeed * S, r: dr, minX: W * 0.30, maxX: W * 0.90 },
      ];

      trail = []; sparks = []; floaters = [];
      G.phase = 'idle'; isDragging = false; mzT = 0;
      hint(true);

      // Build all offscreen layers
      buildStaticLayer();
      buildGoalStatic();
      buildDefSprite();
      buildPuckSprite();
    }

    function resize() {
      const rect = canvas.parentElement.getBoundingClientRect();
      W = rect.width; H = rect.height;
      DPR = devicePixelRatio;
      S = Math.min(W, H) / 390;
      canvas.width = W * DPR; canvas.height = H * DPR;
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      initWorld();
    }
    window.addEventListener('resize', resize);

    // ── Draw: goal (animated zones + static composite) ────────────────────────────
    function drawGoal() {
      const g0 = goalZones[0].x;
      const fs = Math.max(10, r(12)), fsa = Math.max(12, r(14));
      const pulse = 0.5 + 0.5 * Math.sin(mzT * 0.08);

      // Shadow
      ctx.fillStyle = 'rgba(0,0,0,0.2)';
      ctx.fillRect(g0 + 2, 2, goalStatic.gw, goalH);

      goalZones.forEach((z, i) => {
        const active = i === mzIdx;
        ctx.fillStyle = active
          ? (z.pts === 100 ? `rgba(200,240,216,${0.55 + pulse * 0.35})` : z.pts === 50 ? `rgba(96,192,144,${0.45 + pulse * 0.3})` : `rgba(0,122,61,${0.45 + pulse * 0.35})`)
          : z.color;
        ctx.fillRect(z.x, z.y, z.w, z.h);

        // Net lines
        ctx.strokeStyle = 'rgba(255,80,30,0.3)'; ctx.lineWidth = 0.8;
        for (let gy = 0; gy < goalH; gy += r(7)) { ctx.beginPath(); ctx.moveTo(z.x, gy); ctx.lineTo(z.x + z.w, gy); ctx.stroke(); }

        // Label
        ctx.fillStyle = (z.pts === 100) ? (active ? '#04160e' : 'rgba(4,22,14,0.7)') : (active ? '#fff' : 'rgba(255,255,255,0.75)');
        ctx.font = `bold ${active ? fsa : fs}px Barlow Condensed`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(z.label, z.x + z.w / 2, goalH / 2);

        if (i < goalZones.length - 1) {
          ctx.strokeStyle = 'rgba(255,100,50,0.5)'; ctx.lineWidth = Math.max(1, 1.5 * S);
          ctx.beginPath(); ctx.moveTo(z.x + z.w, 0); ctx.lineTo(z.x + z.w, goalH); ctx.stroke();
        }
      });

      // Composite static posts + crease
      ctx.drawImage(goalStatic.canvas, 0, 0, goalStatic.canvas.width, goalStatic.canvas.height, goalStatic.dx, goalStatic.dy, goalStatic.canvas.width / DPR, goalStatic.canvas.height / DPR);

      // Active zone arrow (animated)
      const mz = goalZones[mzIdx], as = Math.max(5, r(7));
      ctx.fillStyle = `rgba(255,255,255,${0.6 + pulse * 0.4})`;
      ctx.beginPath();
      ctx.moveTo(mz.x + mz.w / 2, goalH + r(12));
      ctx.lineTo(mz.x + mz.w / 2 - as, goalH + r(22));
      ctx.lineTo(mz.x + mz.w / 2 + as, goalH + r(22));
      ctx.closePath(); ctx.fill();
    }

    // ── Draw: defenders (sprite + patrol line) ────────────────────────────────────
    function drawDefenders() {
      for (const d of defenders) {
        // Patrol path (behind defender)
        ctx.strokeStyle = 'rgba(237,28,36,0.1)'; ctx.lineWidth = Math.max(1, 1.5 * S);
        ctx.setLineDash([r(4), r(4)]);
        ctx.beginPath(); ctx.moveTo(d.minX, d.y); ctx.lineTo(d.maxX, d.y); ctx.stroke();
        ctx.setLineDash([]);

        // Sprite composite
        const h = defSprite.half;
        ctx.drawImage(defSprite.canvas, 0, 0, defSprite.canvas.width, defSprite.canvas.height, d.x - h, d.y - h, h * 2, h * 2);
      }
    }

    // ── Draw: puck ────────────────────────────────────────────────────────────────
    function drawPuck() {
      // Shadow (dynamic, needs puck position)
      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      ctx.beginPath(); ctx.ellipse(puck.x + 2 * S, puck.y + 3 * S, puck.r, puck.r * 0.45, 0, 0, Math.PI * 2); ctx.fill();

      // Sprite
      const h = puckSprite.half;
      ctx.drawImage(puckSprite.canvas, 0, 0, puckSprite.canvas.width, puckSprite.canvas.height, puck.x - h, puck.y - h, h * 2, h * 2);
    }

    // ── Draw: trail ───────────────────────────────────────────────────────────────
    function drawTrail() {
      trail.forEach((pt, i) => {
        const t = i / trail.length;
        ctx.fillStyle = `rgba(0,160,80,${t * 0.45})`;
        ctx.beginPath(); ctx.arc(pt.x, pt.y, Math.max(puck.r * t * 0.6, 1), 0, Math.PI * 2); ctx.fill();
      });
    }

    // ── Draw: sparks ──────────────────────────────────────────────────────────────
    function addSpark(x, y) {
      for (let i = 0; i < 6; i++) sparks.push({ x, y, vx: (Math.random() - .5) * 4.5, vy: (Math.random() - .5) * 4.5, life: 1, r: Math.random() * 2.5 + 1 });
    }
    function drawSparks() {
      sparks = sparks.filter(s => {
        s.x += s.vx; s.y += s.vy; s.vx *= 0.9; s.vy *= 0.9; s.life -= 0.055;
        if (s.life <= 0) return false;
        ctx.fillStyle = `rgba(0,160,80,${s.life})`;
        ctx.beginPath(); ctx.arc(s.x, s.y, s.r * s.life, 0, Math.PI * 2); ctx.fill();
        return true;
      });
    }

    // ── Draw: floaters (no shadowBlur — expensive on mobile) ─────────────────────
    function drawFloaters() {
      floaters = floaters.filter(f => {
        f.y += f.vy * 0.06; f.life -= 0.007;
        if (f.life <= 0) return false;
        const progress = 1 - f.life;
        const size = (14 + progress * 22) * S * (f.big || 1);
        ctx.globalAlpha = f.life > 0.3 ? 1 : f.life / 0.3;
        ctx.fillStyle = f.color;
        ctx.font = `bold ${Math.round(size)}px Barlow Condensed`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(f.text, f.x, f.y);
        ctx.globalAlpha = 1;
        return true;
      });
    }

    // ── Draw: goal burst particles ────────────────────────────────────────────────
    function drawGoalBurst() {
      goalBurst = goalBurst.filter(p => {
        p.x += p.vx * slowMo; p.y += p.vy * slowMo;
        p.vy += 0.12 * slowMo;
        p.vx *= 0.97; p.life -= 0.018 * slowMo;
        if (p.life <= 0) return false;
        ctx.globalAlpha = Math.min(1, p.life * 2);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        if (p.shape === 'rect') {
          ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot += p.spin);
          ctx.fillRect(-p.sz / 2, -p.sz / 4, p.sz, p.sz / 2);
          ctx.restore();
        } else {
          ctx.arc(p.x, p.y, p.sz * p.life, 0, Math.PI * 2); ctx.fill();
        }
        ctx.globalAlpha = 1;
        return true;
      });
    }

    // ── Web Audio: removed ────────────────────────────────────────────────────────

    // ── Spawn goal burst particles ────────────────────────────────────────────────
    function spawnGoalBurst(x, y, pts) {
      const cols100 = ['#c8f0d8','#fff','#a0e8c8','#ffe066','#fff'];
      const cols50  = ['#60C090','#fff','#2EB279','#c8f0d8'];
      const cols20  = ['#007A3D','#2EB279','#fff','#60C090'];
      const cols = pts === 100 ? cols100 : pts === 50 ? cols50 : cols20;
      const count = pts === 100 ? 80 : pts === 50 ? 55 : 38;
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = (2 + Math.random() * (pts === 100 ? 9 : pts === 50 ? 7 : 5)) * S;
        goalBurst.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - (pts === 100 ? 4 : 2) * S,
          life: 0.7 + Math.random() * 0.5,
          sz: (3 + Math.random() * (pts === 100 ? 8 : 5)) * S,
          color: cols[Math.floor(Math.random() * cols.length)],
          shape: Math.random() > 0.4 ? 'rect' : 'circle',
          rot: Math.random() * Math.PI * 2,
          spin: (Math.random() - 0.5) * 0.3,
        });
      }
    }

    // ── Draw: slingshot ───────────────────────────────────────────────────────────
    function drawSlingshot() {
      if (!isDragging || G.phase !== 'drag') return;
      const ox = puck.x, oy = puck.y, ax = dragStartX, ay = dragStartY;
      const dx = ax - ox, dy = ay - oy, dist = Math.sqrt(dx * dx + dy * dy);
      const power = Math.min(dist / MAX_PUL(), 1);
      const bc = `rgba(46,${Math.round(178 + power * 40)},${Math.round(121 - power * 40)},0.8)`;
      const bo = r(10), rRing = Math.round((20 + power * 10) * S);

      ctx.strokeStyle = bc; ctx.lineWidth = Math.max(2, 2.5 * S); ctx.setLineDash([]);
      for (const offx of [-bo, bo]) {
        ctx.beginPath(); ctx.moveTo(ax + offx, ay);
        ctx.quadraticCurveTo((ax + offx + ox) / 2, (ay + oy) / 2 - 5 * S, ox, oy); ctx.stroke();
      }
      ctx.fillStyle = bc;
      for (const offx of [-bo, bo]) { ctx.beginPath(); ctx.arc(ax + offx, ay, r(4.5), 0, Math.PI * 2); ctx.fill(); }
      ctx.strokeStyle = bc; ctx.lineWidth = Math.max(1.5, 2 * S);
      ctx.beginPath(); ctx.arc(ax, ay, r(8), 0, Math.PI * 2); ctx.stroke();

      ctx.strokeStyle = 'rgba(46,178,121,0.25)'; ctx.lineWidth = Math.max(2, 3 * S);
      ctx.beginPath(); ctx.arc(ax, ay, rRing, 0, Math.PI * 2); ctx.stroke();
      ctx.strokeStyle = `rgba(46,${Math.round(178 + power * 40)},${Math.round(121 - power * 20)},0.85)`;
      ctx.beginPath(); ctx.arc(ax, ay, rRing, -Math.PI / 2, -Math.PI / 2 + power * Math.PI * 2); ctx.stroke();

      ctx.strokeStyle = `rgba(46,178,121,${power * 0.5})`; ctx.lineWidth = 1;
      ctx.setLineDash([r(3), r(4)]);
      ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(ox, oy); ctx.stroke();
      ctx.setLineDash([]);

      let px = ax, py = ay, pvx = (dx / Math.max(dist, 1)) * dist * getLM(), pvy = (dy / Math.max(dist, 1)) * dist * getLM();
      for (let i = 0; i < 22; i++) {
        pvx *= FR; pvy *= FR; px += pvx; py += pvy;
        if (px < puck.r) { px = puck.r; pvx *= -BN; } if (px > W - puck.r) { px = W - puck.r; pvx *= -BN; }
        if (py < puck.r) { py = puck.r; pvy *= -BN; } if (py > H - puck.r) { py = H - puck.r; pvy *= -BN; }
        ctx.fillStyle = `rgba(46,178,121,${(1 - i / 22) * 0.6})`;
        ctx.beginPath(); ctx.arc(px, py, Math.max(1, (5 * (1 - i / 22) + 1) * S), 0, Math.PI * 2); ctx.fill();
      }
      ctx.fillStyle = `rgba(46,${Math.round(178 - power * 50)},${Math.round(121 - power * 40)},0.9)`;
      ctx.font = `bold ${r(12)}px Barlow`; ctx.textAlign = 'center';
      ctx.fillText(Math.round(power * 100) + '%', ox, oy + r(26));
    }

    // ── Draw: tutorial ────────────────────────────────────────────────────────────
    function drawTutorial() {
      tutA++;
      const rp = 0.5 + 0.5 * Math.sin(tutA * 0.07);
      ctx.strokeStyle = `rgba(46,178,121,${0.4 + rp * 0.5})`; ctx.lineWidth = Math.max(2, 2.5 * S);
      ctx.beginPath(); ctx.arc(puck.x, puck.y, puck.r + Math.round((8 + rp * 6) * S), 0, Math.PI * 2); ctx.stroke();

      const apSmooth = 0.5 + 0.5 * Math.sin(tutA * 0.04);
      const aY = puck.y + r(30) + apSmooth * r(22);
      ctx.globalAlpha = 0.55; ctx.fillStyle = '#2EB279'; ctx.strokeStyle = '#2EB279'; ctx.lineWidth = Math.max(7, 10 * S);
      ctx.beginPath(); ctx.moveTo(puck.x, puck.y + r(22)); ctx.lineTo(puck.x, aY); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(puck.x, aY + r(14)); ctx.lineTo(puck.x - r(13), aY); ctx.lineTo(puck.x + r(13), aY); ctx.closePath(); ctx.fill();
      ctx.globalAlpha = 1;

      // POVLECI text — biggest when arrow is longest, synced via same sin
      const textScale = 1 + 0.15 * apSmooth;
      const fontSize = r(16) * textScale;
      ctx.fillStyle = '#2EB279';
      ctx.font = `bold ${fontSize}px Barlow Condensed`; ctx.textAlign = 'center';
      ctx.fillText('POVLECI', puck.x, puck.y + r(80));

      ctx.globalAlpha = 0.25 + 0.2 * Math.sin(tutA * 0.06); ctx.fillStyle = '#00c868';
      ctx.beginPath(); ctx.arc(puck.x, puck.y, puck.r + r(16), 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }

    // ── Update ────────────────────────────────────────────────────────────────────
    function update(dt) {
      if (G.phase !== 'shooting') {
        mzT++;
        if (mzT % 90 === 0) {
          mzIdx += mzDir;
          if (mzIdx >= goalZones.length - 1) { mzIdx = goalZones.length - 1; mzDir = -1; }
          if (mzIdx <= 0) { mzIdx = 0; mzDir = 1; }
        }
      }
      for (const d of defenders) {
        d.x += d.vx * dt / 60;
        if (d.x <= d.minX) { d.x = d.minX; d.vx = Math.abs(d.vx); }
        if (d.x >= d.maxX) { d.x = d.maxX; d.vx = -Math.abs(d.vx); }
      }
      if (G.phase !== 'shooting') return;

      trail.push({ x: puck.x, y: puck.y });
      if (trail.length > 24) trail.shift();

      const fr = Math.pow(FR, dt);
      puck.vx *= fr; puck.vy *= fr; puck.x += puck.vx * dt; puck.y += puck.vy * dt;

      if (puck.x < puck.r) { puck.x = puck.r; puck.vx = Math.abs(puck.vx) * BN; addSpark(puck.x, puck.y); }
      if (puck.x > W - puck.r) { puck.x = W - puck.r; puck.vx = -Math.abs(puck.vx) * BN; addSpark(puck.x, puck.y); }
      if (puck.y < puck.r) { puck.y = puck.r; puck.vy = Math.abs(puck.vy) * BN; addSpark(puck.x, puck.y); }
      if (puck.y > H - puck.r) { puck.y = H - puck.r; puck.vy = -Math.abs(puck.vy) * BN; addSpark(puck.x, puck.y); }

      for (const d of defenders) {
        const dx = puck.x - d.x, dy = puck.y - d.y, dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < puck.r + d.r && dist > 0.01) {
          const nx = dx / dist, ny = dy / dist;
          const dot = puck.vx * nx + puck.vy * ny;
          if (dot < 0) {
            puck.vx -= dot * nx * 1.5;
            puck.vy -= dot * ny * 1.5;
            puck.vx += d.vx * 0.002;
          }
          puck.x = d.x + nx * (puck.r + d.r + 2);
          puck.y = d.y + ny * (puck.r + d.r + 2);
          addSpark(puck.x, puck.y);
        }
      }

      if (puck.y - puck.r <= goalH && puck.y + puck.r >= 0 && puck.vy < -0.4) {
        const hz = goalZones.find(z => puck.x >= z.x - 2 && puck.x <= z.x + z.w + 2);
        if (hz) { onGoal(hz); return; }
      }
      if (puck.vx ** 2 + puck.vy ** 2 < 0.08) onMiss();
    }

    // ── Game events ───────────────────────────────────────────────────────────────
    function onGoal(zone) {
      G.phase = 'dead'; tutDone = true; G.totalScore += zone.pts; G.shots.push(zone.pts);
      // Visual & audio feedback
      slowMo = zone.pts === 100 ? 0.06 : zone.pts === 50 ? 0.10 : 0.14;
      shakePow = zone.pts === 100 ? 18 : zone.pts === 50 ? 12 : 7;
      spawnGoalBurst(puck.x, puck.y, zone.pts);

      document.getElementById('game').classList.add('flash');
      setTimeout(() => document.getElementById('game').classList.remove('flash'), zone.pts === 100 ? 900 : 600);
      // Bigger floater for center goal
      const fSize = zone.pts === 100 ? 2.4 : zone.pts === 50 ? 1.8 : 1;
      floaters.push({ x: puck.x, y: puck.y, text: '+' + zone.pts, color: '#fff', life: 1, vy: -1.2 * S * fSize, big: fSize });
      G.attemptsLeft--; updateUI(); trail = [];
      setTimeout(() => G.attemptsLeft > 0 ? showGoalOv(zone) : showEndGame(), zone.pts === 100 ? 1200 : 950);
    }
    function onMiss() {
      G.phase = 'dead'; tutDone = true; G.shots.push(0);
      floaters.push({ x: puck.x, y: puck.y - r(20), text: 'MIMO!', color: '#ff4444', life: 1, vy: -1.5 * S });
      G.attemptsLeft--; updateUI(); trail = [];
      setTimeout(() => G.attemptsLeft > 0 ? showMissOv() : showEndGame(), 750);
    }
    function resetPuck() {
      puck.x = W / 2; puck.y = H * 0.78; puck.vx = 0; puck.vy = 0; puck.r = PUCK_R();
      trail = []; sparks = []; isDragging = false; G.phase = 'idle'; hint(true);
    }
    function updateUI() {
      document.getElementById('shotNum').textContent = G.attemptsLeft;
      document.getElementById('totalPts').textContent = G.totalScore;
    }

    // ── Game loop ─────────────────────────────────────────────────────────────────
    let lastTime = 0;
    function loop(ts) {
      if (!lastTime) lastTime = ts;
      let dt = (ts - lastTime) / 16.666; lastTime = ts;
      if (!isFinite(dt) || dt <= 0 || dt > 3) dt = 1;

      ctx.clearRect(0, 0, W, H);

      // Screen shake
      if (shakePow > 0.01) {
        shakeX = (Math.random() - 0.5) * shakePow;
        shakeY = (Math.random() - 0.5) * shakePow;
        shakePow *= 0.82;
        ctx.save(); ctx.translate(shakeX, shakeY);
      }

      // Slow-mo ramp back to normal (scaled with real dt, not slow dt)
      if (slowMo < 1) { slowMo = Math.min(1, slowMo + 0.007 * dt); dt *= slowMo; }

      // Static layer: one drawImage instead of hundreds of draw calls
      if (staticLayer) ctx.drawImage(staticLayer, 0, 0, staticLayer.width, staticLayer.height, 0, 0, W, H);

      drawGoal(); drawDefenders(); drawTrail();
      drawGoalBurst(); drawSparks(); drawSlingshot(); drawPuck(); drawFloaters();
      if (!tutDone && G.phase === 'idle') drawTutorial();

      if (shakePow > 0.01) ctx.restore();

      update(dt);
      requestAnimationFrame(loop);
    }

    // ── Input ─────────────────────────────────────────────────────────────────────
    function getPos(e) {
      const rect = canvas.getBoundingClientRect(), t = e.touches ? e.touches[0] : e;
      return { x: (t.clientX - rect.left) * (W / rect.width), y: (t.clientY - rect.top) * (H / rect.height) };
    }
    canvas.addEventListener('mousedown', e => {
      if (G.phase !== 'idle') return;
      const p = getPos(e), dx = p.x - puck.x, dy = p.y - puck.y;
      if (Math.sqrt(dx * dx + dy * dy) < puck.r + r(28)) { isDragging = true; G.phase = 'drag'; dragStartX = puck.x; dragStartY = puck.y; hint(false); }
    });
    canvas.addEventListener('mousemove', e => {
      if (!isDragging) return;
      const p = getPos(e), dx = dragStartX - p.x, dy = dragStartY - p.y, d = Math.sqrt(dx * dx + dy * dy);
      const c2 = Math.min(d, MAX_PUL());
      puck.x = dragStartX - dx / Math.max(d, 1) * c2;
      puck.y = dragStartY - dy / Math.max(d, 1) * c2;
    });
    canvas.addEventListener('mouseup', () => {
      if (!isDragging) return;
      isDragging = false;
      const dx = dragStartX - puck.x, dy = dragStartY - puck.y, d = Math.sqrt(dx * dx + dy * dy);
      if (d < 8) { puck.x = dragStartX; puck.y = dragStartY; G.phase = 'idle'; hint(true); return; }
      puck.x = dragStartX; puck.y = dragStartY; puck.vx = (dx / d) * d * getLM(); puck.vy = (dy / d) * d * getLM();
      G.phase = 'shooting'; trail = [];
    });
    canvas.addEventListener('touchstart', e => { e.preventDefault(); canvas.dispatchEvent(new MouseEvent('mousedown', { clientX: e.touches[0].clientX, clientY: e.touches[0].clientY })); }, { passive: false });
    canvas.addEventListener('touchmove', e => { e.preventDefault(); canvas.dispatchEvent(new MouseEvent('mousemove', { clientX: e.touches[0].clientX, clientY: e.touches[0].clientY })); }, { passive: false });
    canvas.addEventListener('touchend', e => { e.preventDefault(); canvas.dispatchEvent(new MouseEvent('mouseup')); }, { passive: false });

    // ── Overlays ──────────────────────────────────────────────────────────────────
    function showOv(html) {
      const game = document.getElementById('game'), old = game.querySelector('.ov');
      if (old) old.remove();
      const el = document.createElement('div'); el.className = 'ov'; el.innerHTML = html; game.appendChild(el);
    }
    function closeOv() { document.querySelector('.ov')?.remove(); resetPuck(); }
    function zoneColor(pts) { return pts === 100 ? '#c8f0d8' : pts === 50 ? '#60C090' : 'var(--green)'; }
    function zoneTag(pts) { return pts === 100 ? 'CENTER' : pts === 50 ? 'ODLIČNO' : 'ZADETEK'; }
    function goalEmoji(pts) { return pts === 100 ? '🎯' : pts === 50 ? '💥' : '🥅'; }
    function shotsLeft() { const n = G.attemptsLeft; return `${n} ${n === 1 ? 'strel' : 'strela'}`; }

    function showGoalOv(zone) {
      const big = zone.pts === 100, mid = zone.pts === 50, col = zoneColor(zone.pts);
      showOv(`<div class="opts" style="color:${col}">+${zone.pts}</div><div class="ot" style="color:${col}">${big ? 'CENTER!' : mid ? 'ODLIČNO!' : 'ZADETEK!'}</div><div class="os">Imaš še <strong style="color:#fff">${shotsLeft()}</strong>.</div><button class="obtn" onclick="closeOv()">NASLEDNJI STREL</button>`);
    }
    function showMissOv() {
      const msgs = [
        'Skoraj!',
        'Blizu!',
        'Naslednjič!'
      ];
      showOv(`<div class="ot" style="color:#ff4444;margin-top:12px">MIMO!</div><div class="os" style="margin-top:4px">${msgs[Math.floor(Math.random() * msgs.length)]}<br>Imaš še <strong style="color:#fff">${shotsLeft()}</strong>.</div><button class="obtn" onclick="closeOv()">NASLEDNJI STREL</button>`);
    }
    function showEndGame() {
      const stars = G.totalScore >= 200 ? '&#x2B50;&#x2B50;&#x2B50;' : G.totalScore >= 100 ? '&#x2B50;&#x2B50;' : G.totalScore > 0 ? '&#x2B50;' : '';
      const rows = G.shots.map((pts, i) => pts === 0
        ? `<div class="brow miss"><span class="brow-l">Strel ${i + 1}</span><span class="brow-v" style="color:#ff4444">MIMO</span></div>`
        : `<div class="brow g${pts}"><span class="brow-l">Strel ${i + 1} &middot; ${zoneTag(pts)}</span><span class="brow-v" style="color:${zoneColor(pts)}">+${pts}</span></div>`
      ).join('');
      showOv(`<img src="dragon_green.png" style="width:56px;opacity:.9"><div class="ot" style="color:#fff">KONEC!</div><div class="summary"><div class="sl">SKUPAJ TO\u010CK</div><div class="sv">${G.totalScore}</div></div><div class="bdown">${rows}</div><button class="obtn gold" onclick="showForm()">NAPREJ</button><button class="obtn ghost" onclick="restartGame()">IGRAJ ZNOVA</button>`);
    }
    function showForm() {
      showOv(`<img src="dragon_green.png" style="width:48px;opacity:.8"><div class="oi" style="font-size:24px;color:var(--green);font-family:'Barlow Condensed',sans-serif;font-weight:900;letter-spacing:0.08em">HK OLIMPIJA</div><div class="ot" style="color:#fff;font-size:20px">ZABELEŽI SVOJ REZULTAT</div><div class="summary" style="margin:0"><div class="sl">TVOJE TO\u010CKE</div><div class="sv">${G.totalScore}</div></div><div class="fwrap"><div style="display:flex;gap:8px;width:100%"><div class="fgroup" style="flex:1"><div class="fl">Ime</div><input class="fi" type="text" placeholder="Janez" id="fN" name="firstname" autocomplete="given-name"><div class="field-err" id="fN-err"></div></div><div class="fgroup" style="flex:1"><div class="fl">Priimek</div><input class="fi" type="text" placeholder="Novak" id="fS" name="lastname" autocomplete="family-name"><div class="field-err" id="fS-err"></div></div></div><div class="fgroup"><div class="fl">E-naslov</div><input class="fi" type="email" placeholder="janez@email.si" id="fE" name="email" autocomplete="email"><div class="field-err" id="fE-err"></div></div><label class="consent-check" id="chk1-lbl"><input name="mauticform[pravilnikkljukica][]" id="chk1" type="checkbox" value="da" /><span>Strinjam se s <a href="https://marketing.hkolimpija.si/asset/75:pravilnik-3132026" target="_blank">pravili</a> nagradne igre in politiko zasebnosti HK Olimpija Ljubljana.</span></label><div class="field-err" id="chk1-err"></div><label class="consent-check" id="chk2-lbl"><input name="mauticform[marketingconsent][]" id="chk2" type="checkbox" value="da" /><span>Dovoljujem, da HK Olimpija Ljubljana uporabi moj kontakt za ob\u010Dasno po\u0161iljanje klubskih novic, nagradnih iger in posebnih ponudb za navija\u010De.</span></label></div><button class="obtn gold" onclick="submitForm()">ODDAJ REZULTAT</button>`);
    }
    function shakeBtn() {
      const btn = document.querySelector('.ov .obtn.gold');
      if (!btn) return;
      btn.style.animation = 'none'; btn.offsetHeight; // reflow
      btn.style.animation = 'shake 0.4s ease';
    }
    function markField(id, error) {
      const el = document.getElementById(id);
      if (!el) return;
      const errEl = document.getElementById(id + '-err');
      if (error) {
        el.style.borderColor = '#ff4444';
        if (errEl) { errEl.textContent = error; errEl.style.display = 'block'; }
      } else {
        el.style.borderColor = '#1a3a22';
        if (errEl) { errEl.textContent = ''; errEl.style.display = 'none'; }
      }
    }
    function submitForm() {
      const n = document.getElementById('fN').value.trim(), s = document.getElementById('fS').value.trim(), e = document.getElementById('fE').value.trim();
      const chk1 = document.getElementById('chk1')?.checked;
      let valid = true;
      markField('fN', !n ? 'Vnesi ime' : null); if (!n) valid = false;
      markField('fS', !s ? 'Vnesi priimek' : null); if (!s) valid = false;
      if (!e) { markField('fE', 'Vnesi e-naslov'); valid = false; }
      else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e)) { markField('fE', 'Neveljaven e-naslov'); valid = false; }
      else { markField('fE', null); }
      if (!chk1) {
        const errEl = document.getElementById('chk1-err');
        if (errEl) { errEl.textContent = 'Strinjanje s pravili je obvezno'; errEl.style.display = 'block'; }
        document.getElementById('chk1-lbl')?.classList.add('err');
        valid = false;
      } else {
        const errEl = document.getElementById('chk1-err');
        if (errEl) { errEl.textContent = ''; errEl.style.display = 'none'; }
        document.getElementById('chk1-lbl')?.classList.remove('err');
      }
      if (!valid) { shakeBtn(); return; }

      // Show loading state
      const btn = document.querySelector('.ov .obtn.gold');
      if (btn) { btn.textContent = 'POŠILJAM...'; btn.disabled = true; btn.style.opacity = '0.6'; }

      // Submit to Mautic
      const formData = new FormData();
      formData.append('mauticform[formId]', '29');
      formData.append('mauticform[formName]', 'igradnevahcbolzano1232026');
      formData.append('mauticform[firstname]', n);
      formData.append('mauticform[lastname]', s);
      formData.append('mauticform[email]', e);
      formData.append('mauticform[score]', G.totalScore);
      formData.append('mauticform[pravilnikkljukica][]', 'da');
      if (document.getElementById('chk2')?.checked) formData.append('mauticform[marketingconsent][]', 'da');
      formData.append('mauticform[return]', '');
      formData.append('mauticform[submit]', '1');

      fetch('https://marketing.hkolimpija.si/form/submit?formId=29', {
        method: 'POST',
        body: formData,
        mode: 'no-cors'
      }).finally(() => {
        showOv(`<img src="dragon_green.png" style="width:48px;opacity:.85"><div class="ot" style="color:var(--green)">ODDANO!</div><div class="os">Hvala, <strong style="color:#fff">${n} ${s}</strong>!<br><br>Rezultat zabele\u017Een: <strong style="color:var(--gold)">${G.totalScore} to\u010Dk</strong>.</div><div style="font-family:'Barlow Condensed',sans-serif;font-size:12px;color:var(--green);letter-spacing:3px;margin-top:6px">ROJENI IZ LEGENDE</div><button class="obtn" onclick="goToHub()" style="margin-top:8px">DOMOV</button>`);
      });
    }
    function restartGame() {
      G.attemptsLeft = 3; G.totalScore = 0; G.shots = []; tutDone = false; tutA = 0;
      slowMo = 1; shakePow = 0; goalBurst = [];
      document.querySelector('.ov')?.remove(); updateUI(); resetPuck();
    }
    function goToHub() { window.location.href = 'https://marketing.hkolimpija.si/anketa-med-tekmo-2'; }

    // ── Boot ──────────────────────────────────────────────────────────────────────
    document.fonts.ready.then(() => {
      if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock('portrait').catch(() => {});
      }
      resize();
      loop(0);
    });  
  </script>
